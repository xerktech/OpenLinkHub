# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "xerktech-0.9.2" ]
  pull_request:
    branches: [ "main", "xerktech-0.9.2" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Update
        run: sudo apt-get update
      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev libpipewire-0.3-dev pkg-config
      - name: Install dependencies
        run: go get .
      - name: Build
        # libpipewire-0.3.pc advertises -fno-strict-overflow, which is not on
        # cgo's list of accepted compiler flags, so pkg-config output alone
        # fails the build once the runner image ships a recent enough pipewire.
        env:
          CGO_CFLAGS_ALLOW: -fno-strict-overflow
        run: go build -v ./...

  instruction-size:
    # Claude Code instruction files load into every session; keep each under 40,000 characters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check instruction file size
        run: |
          status=0
          for f in $(find . \( -name CLAUDE.md -o -name CLAUDE.local.md -o -path './.claude/rules/*.md' \) -not -path './.git/*'); do
            n=$(wc -m < "$f")
            echo "$f: $n chars"
            if [ "$n" -ge 40000 ]; then echo "::error file=$f::$n chars, cap is 40000"; status=1; fi
          done
          exit $status
